name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=$(curl -s https://repo1.maven.org/maven2/org/videolan/android/libvlc-all/maven-metadata.xml | grep -o "<version>3[^<]*</version>" | tail -6 | tr '\n' ' ')
          M=$(curl -s https://dl.google.com/android/maven2/androidx/media3/media3-exoplayer/maven-metadata.xml | grep -o "<version>[^<]*</version>" | tail -5 | tr '\n' ' ')
          echo "::notice title=vlc::$V"
          echo "::notice title=media3::$M"
